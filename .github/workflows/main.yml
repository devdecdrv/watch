name: Build ParentWatch Agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd agent
          pip install -r requirements.txt

      - name: Build exe
        run: |
          cd agent
          python build.py

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: parentwatch-agent
          path: agent/dist/svchost_helper.exe
          retention-days: 90
